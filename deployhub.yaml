# yaml-language-server: $schema=https://hub.nolzza.net/schemas/deployhub-v1.json
apiVersion: deployhub.io/v1
kind: Project
metadata:
  name: DeployHub
  slug: deployhub
  description: 통합 프로젝트·인프라 관리 시스템
spec:
  lifecycle: production
  importance: 4
  owner: gnghkim
  repository:
    provider: github
    slug: gnghkim/DeployHub
  components:
    - name: web
      type: frontend
      framework: nextjs
      runtime: nodejs
      language: typescript
      criticality: 4
      path: apps/web
      provider: hostinger
      container: deployhub-web
      url: https://hub.nolzza.net
    - name: worker
      type: worker
      runtime: nodejs
      language: typescript
      criticality: 3
      path: apps/worker
      provider: hostinger
      container: deployhub-worker
    - name: snapshotter
      type: api
      runtime: nodejs
      language: typescript
      path: apps/snapshotter
      provider: hostinger
      container: deployhub-snapshotter
    - name: database
      type: database
      runtime: postgresql
      criticality: 5
      provider: self-hosted
      container: deployhub-postgres
    - name: socket-proxy
      type: monitoring
      provider: self-hosted
      container: deployhub-socket-proxy
      criticality: 2
  domains:
    - domain: hub.nolzza.net
      environment: production
  documents:
    - type: readme
      path: README.md
