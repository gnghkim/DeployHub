services:
  postgres:
    image: postgres:17-alpine
    container_name: deployhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deployhub
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub -d deployhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [deployhub]
    labels:
      deployhub.project: "deployhub"
      deployhub.component: "postgres"
      deployhub.environment: "production"

  web:
    image: deployhub:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deployhub-web
    restart: unless-stopped
    command: ["node", "apps/web/server.js"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
    # deployhub: postgres 접근용 내부망
    # web: 공용 Caddy 가 이 컨테이너에 닿기 위한 공유망
    networks: [deployhub, web]
    labels:
      deployhub.project: "deployhub"
      deployhub.component: "web"
      deployhub.environment: "production"

  worker:
    image: deployhub:${TAG:-local}
    container_name: deployhub-worker
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deployhub]
    labels:
      deployhub.project: "deployhub"
      deployhub.component: "worker"
      deployhub.environment: "production"

  # 마이그레이션 전용. 평소에는 뜨지 않고 아래로만 실행한다.
  #   docker compose --env-file .env -f docker/compose.yml --profile tools run --rm migrate
  #
  # build 스테이지를 쓰는 이유는 drizzle-kit 이 devDependency 라 runtime
  # 스테이지에는 없기 때문이다. postgres 는 호스트 포트를 열지 않으므로
  # 반드시 deployhub 네트워크 안에서 실행해야 한다.
  migrate:
    image: deployhub-migrate:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: build
    profiles: ["tools"]
    command: ["pnpm", "--filter", "@deployhub/db", "exec", "drizzle-kit", "migrate"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deployhub]

  # 전용 서버에서만 쓴다. 기본으로 뜨지 않는다.
  #   docker compose ... --profile standalone up -d caddy
  #
  # 실제 배포 대상 VPS 에는 이미 공용 Caddy 가 80/443 을 점유하고 web
  # 네트워크에서 여러 프로젝트를 프록시하고 있다. 이 서비스를 함께 띄우면
  # 포트 충돌로 기존 서비스가 죽는다. 공용 서버에서는 /opt/caddy/Caddyfile
  # 에 site 블록을 추가해 deployhub-web:3000 으로 프록시한다.
  caddy:
    image: deployhub-caddy:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/Caddyfile.Dockerfile
    container_name: deployhub-caddy
    restart: unless-stopped
    profiles: ["standalone"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?HUB_DOMAIN required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [deployhub]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # 내부 전용. postgres 와 앱만 붙는다. 외부에서 닿지 못한다.
  deployhub:
  # 공용 Caddy 가 쓰는 기존 네트워크. 서버에 이미 존재한다.
  # 전용 서버에 새로 설치한다면 external 을 지우고 standalone 프로파일로
  # 자체 Caddy 를 띄운다.
  web:
    external: true
