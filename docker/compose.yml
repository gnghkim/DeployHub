services:
  postgres:
    image: postgres:17-alpine
    container_name: deployhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deployhub
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub -d deployhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [deployhub]
    labels:
      deployhub.project: "deployhub"
      # deployhub.yaml 의 구성요소 이름과 정확히 같아야 한다. 자동 연결은
      # 정확 일치만 하므로 여기가 postgres 면 database 구성요소에 붙지
      # 않는다. 운영 배포에서 실제로 안 붙었다.
      deployhub.component: "database"
      deployhub.environment: "production"

  web:
    image: deployhub:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deployhub-web
    restart: unless-stopped
    command: ["node", "apps/web/server.js"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
    # deployhub: postgres 접근용 내부망
    # web: 공용 Caddy 가 이 컨테이너에 닿기 위한 공유망
    networks: [deployhub, web]
    labels:
      deployhub.project: "deployhub"
      deployhub.component: "web"
      deployhub.environment: "production"

  worker:
    image: deployhub:${TAG:-local}
    container_name: deployhub-worker
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    env_file: [../.env]
    environment:
      DOCKER_HOST_URL: ${DOCKER_HOST_URL:-http://socket-proxy:2375}
      SNAPSHOTTER_URL: ${SNAPSHOTTER_URL:-http://snapshotter:3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deployhub, docker-api, snapshot]
    labels:
      deployhub.project: "deployhub"
      deployhub.component: "worker"
      deployhub.environment: "production"

  snapshotter:
    image: deployhub-snapshotter:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/Snapshotter.Dockerfile
    container_name: deployhub-snapshotter
    restart: unless-stopped
    user: pwuser
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=./playwright-seccomp.json
    networks: [snapshot]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const socket=net.connect(3001,'127.0.0.1');socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000).unref()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    labels:
      deployhub.project: "deployhub"
      deployhub.component: "snapshotter"
      deployhub.environment: "production"

  socket-proxy:
    # 스택에서 유일하게 docker.sock 을 쥐는 컨테이너다. 태그를 비워 두면
    # latest 로 해석되어 pull 한 번에 이 코드가 조용히 바뀐다. 다이제스트로
    # 고정한다. 올릴 때는 릴리스 노트를 읽고 다이제스트를 함께 갱신한다.
    image: tecnativa/docker-socket-proxy:0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: deployhub-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    labels:
      deployhub.project: "deployhub"
      deployhub.component: "socket-proxy"
      deployhub.environment: "production"

  # 마이그레이션 전용. 평소에는 뜨지 않고 아래로만 실행한다.
  #   docker compose --env-file .env -f docker/compose.yml --profile tools run --rm migrate
  #
  # build 스테이지를 쓰는 이유는 drizzle-kit 이 devDependency 라 runtime
  # 스테이지에는 없기 때문이다. postgres 는 호스트 포트를 열지 않으므로
  # 반드시 deployhub 네트워크 안에서 실행해야 한다.
  migrate:
    image: deployhub-migrate:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: build
    profiles: ["tools"]
    command: ["pnpm", "--filter", "@deployhub/db", "exec", "drizzle-kit", "migrate"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deployhub]

  # 전용 서버에서만 쓴다. 기본으로 뜨지 않는다.
  #   docker compose ... --profile standalone up -d caddy
  #
  # 실제 배포 대상 VPS 에는 이미 공용 Caddy 가 80/443 을 점유하고 web
  # 네트워크에서 여러 프로젝트를 프록시하고 있다. 이 서비스를 함께 띄우면
  # 포트 충돌로 기존 서비스가 죽는다. 공용 서버에서는 /opt/caddy/Caddyfile
  # 에 site 블록을 추가해 deployhub-web:3000 으로 프록시한다.
  caddy:
    image: deployhub-caddy:${TAG:-local}
    build:
      context: ..
      dockerfile: docker/Caddyfile.Dockerfile
    container_name: deployhub-caddy
    restart: unless-stopped
    profiles: ["standalone"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?HUB_DOMAIN required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [deployhub]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # 내부 전용. postgres 와 앱만 붙는다. 외부에서 닿지 못한다.
  deployhub:
  docker-api:
    internal: true
  # Snapshotter needs public egress for captures; only the worker may reach it.
  snapshot:
  # 공용 Caddy 가 쓰는 기존 네트워크. 서버에 이미 존재한다.
  # 전용 서버에 새로 설치한다면 external 을 지우고 standalone 프로파일로
  # 자체 Caddy 를 띄운다.
  web:
    external: true
